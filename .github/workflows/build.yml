# ============================================================
# FILE: .github/workflows/build-web2apk.yml
# ============================================================
name: Build Flutter APK from ZIP

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP file Flutter project'
        required: true
        type: string
      tag1:
        description: 'Tag / Version (contoh: v1.0.0)'
        required: false
        type: string
        default: 'v1.0.0'
      build_type:
        description: 'Type Build (debug/release)'
        required: false
        type: choice
        default: 'debug'
        options:
          - debug
          - release

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.0'
        channel: 'stable'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget

    - name: Download ZIP from URL
      run: |
        wget -O project.zip "${{ github.event.inputs.zip_url }}"
        unzip project.zip -d project
        ls -la project

    - name: Build APK
      run: |
        cd project
        flutter pub get
        flutter build apk --${{ github.event.inputs.build_type }}
        ls -la build/app/outputs/flutter-apk/

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: flutter-apk-${{ github.event.inputs.tag1 }}
        path: project/build/app/outputs/flutter-apk/*.apk

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: project/build/app/outputs/flutter-apk/*.apk
        name: KENSHI AM PREM ${{ github.event.inputs.tag1 }}
        body: |
          ## 🔥 KENSHI AM PREM — Flutter APK
          
          📱 Build: ${{ github.event.inputs.build_type }}
          📌 Version: ${{ github.event.inputs.tag1 }}
          📅 Build Time: ${{ github.event.repository.updated_at }}
          
          ### Cara Install:
          1. Download APK
          2. Install di HP
          3. Buka aplikasi
          4. /start
          
          ### Support:
          - Owner: @kenshix7x
          - Channel: @thisryvex
        draft: false
        prerelease: false
