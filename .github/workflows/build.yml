name: Build APK

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama Aplikasi'
        required: true
        default: 'MyApp'
      mode:
        description: 'Mode Build'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get latest zip file
        run: |
          LATEST_ZIP=$(ls -t *.zip | head -1)
          echo "ZIP_FILE=$LATEST_ZIP" >> $GITHUB_ENV
          unzip "$LATEST_ZIP" -d ./project

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Build APK
        run: |
          cd ./project
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: project/build/app/outputs/flutter-apk/*.apk
