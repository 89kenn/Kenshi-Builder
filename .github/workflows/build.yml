name: Build & Deploy KENSHI AM PREM — Web2APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Build Web Project
      run: npm run build

    - name: Upload Web Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: web-build-${{ github.sha }}
        path: dist/

  build-apk:
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [30, 31, 32, 33]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Web Build
      uses: actions/download-artifact@v4
      with:
        name: web-build-${{ github.sha }}
        path: web-build

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip

    - name: Download PWA2APK Tool
      run: |
        wget https://github.com/GoogleChromeLabs/pwacompat/releases/latest/download/pwacompat-cli.jar
        wget https://github.com/GoogleChromeLabs/pwacompat/releases/latest/download/pwacompat-cli.jar.sha256

    - name: Build APK with PWA2APK
      run: |
        java -jar pwacompat-cli.jar \
          --source web-build \
          --output app.apk \
          --package com.kenshi.amprem \
          --version-name ${{ github.ref_name }} \
          --version-code ${{ github.run_number }}

    - name: Build with Capacitor (Alternatif)
      run: |
        npx @capacitor/cli create KENSHI-AM-PREM com.kenshi.amprem KENSHI-AM-PREM
        npx @capacitor/cli copy
        npx @capacitor/cli open android
      continue-on-error: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kenshi-am-prem-${{ matrix.api-level }}-${{ github.sha }}
        path: |
          *.apk
          app/build/outputs/apk/**/*.apk
        if-no-files-found: ignore

  build-web2apk:
    needs: build-web
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Web Build
      uses: actions/download-artifact@v4
      with:
        name: web-build-${{ github.sha }}
        path: web-build

    - name: Install Web2APK CLI
      run: npm install -g web2apk

    - name: Build APK with Web2APK
      run: |
        web2apk build \
          --input web-build \
          --output app.apk \
          --name "KENSHI AM PREM" \
          --package "com.kenshi.amprem" \
          --version "${{ github.ref_name }}" \
          --icon "web-build/icon.png"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kenshi-am-prem-apk-${{ github.sha }}
        path: app.apk

  deploy-release:
    needs: [build-apk, build-web2apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download All APKs
      uses: actions/download-artifact@v4
      with:
        path: releases

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: releases/**/*.apk
        name: KENSHI AM PREM v${{ github.ref_name }} — APK
        body: |
          ## 📱 KENSHI AM PREM v${{ github.ref_name }}
          
          ### 🔥 APK Android
          
          Download dan install APK di HP Android kamu!
          
          ### 📌 Fitur:
          - ✅ Aktivasi Alight Motion Premium 1 Tahun
          - ✅ IQC Chat iPhone
          - ✅ Auto Generate Struk
          - ✅ Referral & Afiliasi
          - ✅ Multi Language (EN/ID)
          - ✅ Auto Reply Custom
          - ✅ Daily Reward Streak
          - ✅ 30+ Fitur Lainnya
          
          ### 🚀 Cara Install:
          1. Download APK
          2. Buka File Manager
          3. Klik APK → Install
          4. Buka Aplikasi
          5. /start
          
          ### 📞 Support:
          - Owner: @kenshix7x
          - Channel: @thisryvex
        draft: false
        prerelease: false

  telegram-notify:
    runs-on: ubuntu-latest
    needs: [build-apk, build-web2apk, deploy-release]
    if: always()
    steps:
    - name: Send Telegram Notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        token: ${{ secrets.BOT_TOKEN }}
        message: |
          📱 *KENSHI AM PREM — APK BUILD*
          
          📌 Repository: ${{ github.repository }}
          📌 Branch: ${{ github.ref_name }}
          📌 Commit: ${{ github.sha }}
          📌 Status: ${{ job.status }}
          
          📦 APK: ${{ needs.build-apk.result }}
          📦 Web2APK: ${{ needs.build-web2apk.result }}
          📦 Release: ${{ needs.deploy-release.result }}
          
          👤 Owner: @kenshix7x
          📢 Channel: @thisryvex
